# =============================================================================
# CONFIGURACIÓN ESPECÍFICA PARA PRODUCCIÓN (PRD)
# =============================================================================

# -----------------------------------------------------------------------------
# CONFIGURACIÓN DEL AMBIENTE
# -----------------------------------------------------------------------------
environment:
  name: "prd"
  log_level: "INFO"
  min_scale: 1  # PRD siempre debe tener al menos 1 instancia
  max_scale: 50

# -----------------------------------------------------------------------------
# PROYECTOS Y INFRAESTRUCTURA
# -----------------------------------------------------------------------------
project:
  id: "agro-extension-digital-prd"
  
terraform_state:
  bucket: "agro-extension-digital-prd-tf-state-bucket"

# -----------------------------------------------------------------------------
# NOMBRES DE SERVICIOS (para coincidir con los existentes)
# -----------------------------------------------------------------------------
service_names:
  agent_aa: "agent-aa-prd"    # Nombre real del servicio en GCP
  webhook: "agent-webhook-prd"

# -----------------------------------------------------------------------------
# CONFIGURACIÓN DE SERVICIOS EXTERNOS
# -----------------------------------------------------------------------------
bigquery:
  dataset: "agro_extension_digital_prd_dataset"

# Facebook App IDs específicos para PRD
facebook:
  aa_app_id: "692894087240362"   # App específico para AA
  pp_app_id: "619189944620159"   # App específico para PP

# -----------------------------------------------------------------------------
# DATASTORES DEL AMBIENTE PRD
# -----------------------------------------------------------------------------
datastores:
  aa: "0001-adecuacion-agroindustrial_1749006214130"
  pp: "0001-produccion-primaria_1749005766833"
  guides: "0001-guias_1749005972756"
  faq: "0001-faq_1749006101377"
  chileprunes: "0001-chileprunes-cl_1749005569113"

# -----------------------------------------------------------------------------
# CONFIGURACIÓN DE PERFORMANCE Y RECURSOS
# -----------------------------------------------------------------------------
timeouts:
  agent_http: "60"
  whatsapp_http: "60"

resources:
  cpu: "2000m"
  memory: "1Gi"
