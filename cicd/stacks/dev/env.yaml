# =============================================================================
# CONFIGURACIÓN ESPECÍFICA PARA DESARROLLO (DEV)
# =============================================================================

# -----------------------------------------------------------------------------
# CONFIGURACIÓN DEL AMBIENTE
# -----------------------------------------------------------------------------
environment:
  name: "dev"
  log_level: "DEBUG"
  min_scale: 0  # DEV permite scale-to-zero
  max_scale: 10

# -----------------------------------------------------------------------------
# PROYECTOS Y INFRAESTRUCTURA
# -----------------------------------------------------------------------------
project:
  id: "agro-extension-digital-npe"
  
terraform_state:
  bucket: "agro-extension-digital-npe-tf-state-bucket"

# CI/CD deployer SA (the identity behind GCP_SA_KEY in deploy-agents.yml).
# Set this to have Terraform grant the deploy IAM (actAs on the runtime SAs,
# objectAdmin on the staging bucket, aiplatform.user, secretVersionAdder on the
# engine-name secrets, secretAccessor on the runtime-config secrets). Leave
# unset/commented to manage those grants out of band.
# cicd:
#   deployer_sa_email: "<deployer-sa>@agro-extension-digital-npe.iam.gserviceaccount.com"

# -----------------------------------------------------------------------------
# CONFIGURACIÓN DE SERVICIOS EXTERNOS
# -----------------------------------------------------------------------------
bigquery:
  dataset: "sandbox_rsolar"

# Facebook App IDs para DEV (mismo app para AA y PP)
facebook:
  app_id: "586486637888050"

# -----------------------------------------------------------------------------
# DATASTORES DEL AMBIENTE DEV
# -----------------------------------------------------------------------------
datastores:
  aa: "0001-adecuacion-agroindustrial_1745450263959"
  pp: "0001-produccion-primaria_1745450565038"
  guides: "0001-guias_1745450505033"
  faq: "0001-faq_1745450327301"
  chileprunes: "0001-chileprunes-cl_1748096068703"

# -----------------------------------------------------------------------------
# CONFIGURACIÓN DE PERFORMANCE Y RECURSOS
# -----------------------------------------------------------------------------
timeouts:
  agent_http: "30"
  whatsapp_http: "30"

resources:
  cpu: "1000m"
  memory: "512Mi"
 